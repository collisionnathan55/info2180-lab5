<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>World Database Lookup</title>

		<!-- you can modify this as needed or to your preference -->
		<link href="world.css" type="text/css" rel="stylesheet" />

		<!-- you write this -->
		<script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
		<script src="world.js" type="text/javascript"></script>
	</head>

	<body>
		<header>
			<h1>ATLAS</h1>
			<img src="images/flaticon-globe.png" width="80" />
		</header>

		<main>
			<div id="controls">
				<div>
					<label for="country">Country</label>
					<input id="country" type="search" name="country" placeholder="enter country name" pattern="^[A-Za-z_ ]+$"/>
				</div>
				<button id="lookup-country">Lookup Country</button>
				<button id="lookup-city">Lookup Cities</button>
			</div>

			<hr>

			<div id="result">
				<!-- countries will appear here -->
			</div>
		</main>

	</body>
</html>
